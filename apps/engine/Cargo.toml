[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
rand = "0.10.1"
rand_distr = "0.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slotmap = "1.1.1"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"

# --- throwaway: S3 readout upload for the CDK experiment (src/output.rs) ---
# Delete this block, `mod output;` in main.rs, and the upload call in
# simulation::run when the experiment is done.
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }
