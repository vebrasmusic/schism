[package]
name = "api"
version = "0.1.0"
edition = "2024"
default-run = "api"

[dependencies]
aide = { version = "0.15.1", features = ["axum", "axum-json", "axum-tokio"] }
anyhow = "1.0.102"
axum = "0.8.7"
engine = { path = "../engine" }
schemars = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
